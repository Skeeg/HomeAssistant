- id: Dads_Dimmer_Gradual_Turn_On
  alias: Dads Dimmer Gradual Turn On
  description: ''
  triggers:
  - trigger: time
    at: 06:10:00
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
    - sun
  conditions: []
  actions:
  - action: light.turn_on
    metadata: {}
    target:
      entity_id: light.dads_dimmer
    data:
      brightness: 1
  - repeat:
      until:
      - condition: template
        value_template: '{{ state_attr(''light.dads_dimmer'', ''brightness'') | int(0)
          >= 255 or is_state(''light.dads_dimmer'', ''off'') }}'
      sequence:
      - delay:
          hours: 0
          minutes: 0
          seconds: 15
          milliseconds: 0
      - action: light.turn_on
        target:
          entity_id: light.dads_dimmer
        data:
          brightness_step: 1
    enabled: true
  mode: single
