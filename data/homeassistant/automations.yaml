- id: X1C_Chamber_Heat_-_Engage_Bento_Box
  alias: X1C Chamber Heat - Engage Bento Box
  description: Turns on the printer fan when the chamber temperature exceeds 98°F.
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.x1c_chamber_temperature
    above: 97
    below: 1000
  conditions: []
  actions:
  - target:
      entity_id:
      - fan.printer_bento_box
    action: fan.turn_on
    data: {}
  - delay: 00:00:15
  mode: parallel
  max: 4
  max_exceeded: info
- id: X1C_Chamber_Heat_-_Disengage_Bento_Box
  alias: X1C Chamber Heat - Disengage Bento Box
  description: Turns off the printer fan when the chamber temperature is below 97
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.x1c_chamber_temperature
    above: -1000
    below: 97
  conditions: []
  actions:
  - target:
      entity_id:
      - fan.printer_bento_box
    action: fan.turn_off
    data: {}
  - delay: 00:00:15
  mode: parallel
  max: 4
  max_exceeded: info
- id: Basement_Switch_Multiclick
  alias: Basement Switch - Multiclick
  description: >-
    basement-light-switch native event entity (single/double/triple/quad).
    Replaces the four esphome.switch friendly-name automations.
  triggers:
  - trigger: state
    entity_id: event.basement_light_switch_button
    not_from:
    - unavailable
    not_to:
    - unavailable
    - unknown
  variables:
    click: "{{ trigger.to_state.attributes.event_type }}"
  actions:
  - choose:
    - conditions: "{{ click == 'single' }}"
      sequence:
      - action: light.toggle
        data:
          color_temp_kelvin: 3499
        target:
          entity_id: light.all_basement_lights
    - conditions: "{{ click == 'double' }}"
      sequence:
      - action: light.toggle
        data:
          color_temp_kelvin: 3499
        target:
          entity_id: light.office_lights
    - conditions: "{{ click == 'triple' }}"
      sequence:
      - action: light.toggle
        data:
          color_temp_kelvin: 3499
        target:
          entity_id: light.gym_light
    - conditions: "{{ click == 'quad' }}"
      sequence:
      - action: light.toggle
        data:
          color_temp_kelvin: 3499
        target:
          entity_id: light.basement_lights
  mode: queued
  max: 5
