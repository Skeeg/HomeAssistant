---
# UDP 3-way link — SECONDARY side (hardware-agnostic).
# Air-time: a press sends immediately + a 2-packet retry burst (+1s, +3s);
# otherwise only a 5-minute heartbeat. press_seq is published ONLY on press and
# twice after boot (every publish triggers a send, packet_transport.cpp:225-237).
#
# A press (hardware package calls `lambda: id(press_seq_value) += 1;` then
# `component.update: press_seq`) publishes press_seq to the primary, which
# toggles the load. The primary's relay_state drives this node's own
# `${device_class}_1` entity (status LED / black-hole relay). No HA event is
# fired — HA would otherwise toggle the primary a second time.
#
# press_seq starts at a random base each boot (RAM only) so the primary can
# tell "secondary rebooted" from "button pressed".
# Flash wear: ZERO (no rolling code; RAM-only globals; encryption is RAM-only).
#
# Required substitutions: udp_peer_ip, udp_peer_name (primary's node name).
substitutions:
  udp_heartbeat_interval: 5min

esphome:
  on_boot:
    # Announce our (new random) sequence so the primary resyncs; twice, in case
    # the primary is booting at the same time (power cut).
    priority: -100
    then:
      - wait_until:
          condition:
            wifi.connected:
          timeout: 60s
      - delay: 15s
      - component.update: press_seq
      - delay: 45s
      - component.update: press_seq

globals:
  - id: press_seq_value
    type: float
    restore_value: no
    initial_value: "(float) (1000 + (esphome::random_uint32() % 1000000))"

udp:
  addresses:
    - ${udp_peer_ip}

packet_transport:
  platform: udp
  id: udp_3way
  update_interval: ${udp_heartbeat_interval}
  encryption: !secret udp_3way_key
  providers:
    - name: ${udp_peer_name}
      encryption: !secret udp_3way_key
  sensors:
    - press_seq

sensor:
  - platform: template
    id: press_seq
    internal: true
    accuracy_decimals: 0
    update_interval: never # published only on press / boot
    lambda: return id(press_seq_value);

script:
  # Called by the hardware package after each press: retry the send twice so a
  # dropped packet is recovered in ~3 s. restart: a new press re-arms it.
  - id: udp_3way_burst
    mode: restart
    then:
      - delay: 1s
      - component.update: udp_3way
      - delay: 2s
      - component.update: udp_3way

binary_sensor:
  - platform: packet_transport
    id: primary_relay
    provider: ${udp_peer_name}
    remote_id: relay_state
    internal: true
    on_state:
      - if:
          condition:
            lambda: return x;
          then:
            - ${device_class}.turn_on: ${device_class}_1
          else:
            - ${device_class}.turn_off: ${device_class}_1
