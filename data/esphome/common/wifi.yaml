---
substitutions:
  # WiFi tuning knobs. Defaults below reproduce the ESPHome ESP8266 defaults,
  # so any device that does NOT override them behaves exactly as before.
  # Override per-device with a `substitutions:` block in the device config.
  # ESP32 devices that include this file pin their own platform defaults
  # (output_power 20.5 / power_save_mode LIGHT) in their top-level substitutions.
  wifi_reboot_timeout: 15min
  wifi_output_power: "20"        # ESP8266 default 20 dB (20.5 can cause restarts)
  wifi_power_save_mode: "NONE"   # ESP8266 default; ESP32 platform default is LIGHT
  wifi_fast_connect: "false"     # ESPHome default; "true" skips the pre-connect scan

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret fallback_ap_password
  manual_ip:
    static_ip: $ip_address
    gateway: !secret gateway
    subnet: !secret subnet
    dns1: !secret dns1
    dns2: !secret dns2
  min_auth_mode: WPA2
  reboot_timeout: ${wifi_reboot_timeout}
  output_power: ${wifi_output_power}
  power_save_mode: ${wifi_power_save_mode}
  fast_connect: ${wifi_fast_connect}

captive_portal:
