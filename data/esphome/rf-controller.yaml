substitutions:
  name: rf-controller
  friendly_name: RF Controller
  ip_address: 10.3.2.160
  # Sonoff RF Bridge R2 v2.2: ESP8285 (internal 1 MB flash, DOUT)
  esp8266_board: esp8285
  logger_baud_rate: 0

packages:
  api: !include common/api.yaml
  common-elements: !include common/common-elements.yaml
  common-esp8266: !include common/common-esp8266.yaml
  esphome: !include common/esphome.yaml
  logger: !include common/logger.yaml
  ota: !include common/ota.yaml
  time: !include common/time.yaml
  web: !include common/web-server.yaml
  wifi: !include common/wifi.yaml

# Radio MCU (U1, 8R08A1) runs mightymos Portisch v0.4.16
# (portisch_main_OB38S003_BUCKET_SNIFFING_INCLUDED.hex, flashed 2026-10-05 via J3).
# Portisch times in real microseconds and sends each 0xA5 code 8 times.
# (Stock firmware on this board used ~2x units: 10138/376/1094 for the same remotes.)
# sysadmin plans/2026-10-03_rf-controller-portisch-pairing.md
#
# Etekcity ZAP 5LX plugs: HS2260A-R4 (PT2260) remote, 24-bit fixed code,
# rc-switch protocol 1. Code layout from published 5LX codes:
#   byte 1 = address (A0-A3), byte 2 = A4-A7 (A5-A7 select outlets 3-5),
#   byte 3 = D0-D3 (D0/D1 select outlets 2/1, D2/D3 = OFF/ON).
# Existing remote address is 0x50/0x55 (codes 0x5055xx); new plugs use
# addresses 0x14 and 0x41 so they never collide with it.
esphome:
  area: 'Family'

uart:
  tx_pin: 1
  rx_pin: 3
  baud_rate: 19200

light:
  - platform: status_led
    name: "Switch state"
    pin:
      number: GPIO13
      inverted: true

api:
  services:
    - service: send_rf_code
      variables:
        sync: int
        low: int
        high: int
        code: int
      then:
        - rf_bridge.send_code:
            sync: !lambda 'return sync;'
            low: !lambda 'return low;'
            high: !lambda 'return high;'
            code: !lambda 'return code;'
    - service: send_rf_code_raw
      variables:
        raw: string
      then:
        - rf_bridge.send_raw:
            raw: !lambda 'return raw;'
    - service: learn
      then:
        - rf_bridge.learn

rf_bridge:
  on_code_received:
    then:
      - homeassistant.event:
          event: esphome.rf_code_received
          data:
            sync: !lambda 'return format_hex(data.sync);'
            low: !lambda 'return format_hex(data.low);'
            high: !lambda 'return format_hex(data.high);'
            code: !lambda 'return format_hex(data.code);'
  on_advanced_code_received:
    then:
      - homeassistant.event:
          event: esphome.rf_advanced_code_received
          data:
            length: !lambda 'return format_hex(data.length);'
            protocol: !lambda 'return format_hex(data.protocol);'
            code: !lambda 'return data.code;'

select:
  - platform: template
    id: rf_timing
    name: "RF timing profile"
    icon: mdi:sine-wave
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      # index 0: Etekcity remote as measured by Portisch on this bridge (2026-10-05)
      - "Measured remote (5660/168/495 us)"
      # index 1: published Etekcity rc-switch protocol 1, 190 us pulse (pairs and works, 2026-10-05)
      # (kept at index 1: restore_value stores the index, and the device already holds 1)
      - "Published Etekcity (5890/190/570 us)"
    initial_option: "Published Etekcity (5890/190/570 us)"

number:
  - platform: template
    id: rf_repeats
    name: "RF send repeats"
    icon: mdi:repeat
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 1
    max_value: 20
    step: 1
    # Portisch already sends each code 8 times; 1 command is enough
    initial_value: 1

script:
  - id: rf_send
    mode: queued
    max_runs: 20
    parameters:
      code: int
    then:
      - repeat:
          count: !lambda 'return (int) id(rf_repeats).state;'
          then:
            - rf_bridge.send_code:
                sync: !lambda 'return id(rf_timing).active_index().value_or(0) == 0 ? 5660 : 5890;'
                low: !lambda 'return id(rf_timing).active_index().value_or(0) == 0 ? 168 : 190;'
                high: !lambda 'return id(rf_timing).active_index().value_or(0) == 0 ? 495 : 570;'
                code: !lambda 'return code;'
            # one 0xA5 = 8 frames of ~24 ms; leave room before the next command
            - delay: 400ms

button:
  - platform: template
    name: "Beep"
    on_press:
      - rf_bridge.beep:
          duration: 100
  - platform: template
    name: "Advanced sniffing start"
    entity_category: diagnostic
    on_press:
      - rf_bridge.start_advanced_sniffing
  - platform: template
    name: "Advanced sniffing stop"
    entity_category: diagnostic
    on_press:
      - rf_bridge.stop_advanced_sniffing
  - platform: template
    name: "Bucket sniffing start"
    entity_category: diagnostic
    on_press:
      - rf_bridge.start_bucket_sniffing

# Pairing: hold the plug's program button until the LED flashes, release,
# then press ON (or OFF) here. LED stops flashing when learned.
switch:
  # Address 0x14 (plugs 01-05)
  - platform: template
    name: "RF Plug 01"
    optimistic: true
    assumed_state: true
    turn_on_action:
      - script.execute: { id: rf_send, code: 0x145533 }
    turn_off_action:
      - script.execute: { id: rf_send, code: 0x14553C }
  - platform: template
    name: "RF Plug 02"
    optimistic: true
    assumed_state: true
    turn_on_action:
      - script.execute: { id: rf_send, code: 0x1455C3 }
    turn_off_action:
      - script.execute: { id: rf_send, code: 0x1455CC }
  - platform: template
    name: "RF Plug 03"
    optimistic: true
    assumed_state: true
    turn_on_action:
      - script.execute: { id: rf_send, code: 0x145703 }
    turn_off_action:
      - script.execute: { id: rf_send, code: 0x14570C }
  - platform: template
    name: "RF Plug 04"
    optimistic: true
    assumed_state: true
    turn_on_action:
      - script.execute: { id: rf_send, code: 0x145D03 }
    turn_off_action:
      - script.execute: { id: rf_send, code: 0x145D0C }
  - platform: template
    name: "RF Plug 05"
    optimistic: true
    assumed_state: true
    turn_on_action:
      - script.execute: { id: rf_send, code: 0x147503 }
    turn_off_action:
      - script.execute: { id: rf_send, code: 0x14750C }
  # Address 0x41 (plugs 06-10)
  - platform: template
    name: "RF Plug 06"
    optimistic: true
    assumed_state: true
    turn_on_action:
      - script.execute: { id: rf_send, code: 0x415533 }
    turn_off_action:
      - script.execute: { id: rf_send, code: 0x41553C }
  - platform: template
    name: "RF Plug 07"
    optimistic: true
    assumed_state: true
    turn_on_action:
      - script.execute: { id: rf_send, code: 0x4155C3 }
    turn_off_action:
      - script.execute: { id: rf_send, code: 0x4155CC }
  - platform: template
    name: "RF Plug 08"
    optimistic: true
    assumed_state: true
    turn_on_action:
      - script.execute: { id: rf_send, code: 0x415703 }
    turn_off_action:
      - script.execute: { id: rf_send, code: 0x41570C }
  - platform: template
    name: "RF Plug 09"
    optimistic: true
