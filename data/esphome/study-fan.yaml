---
# Study 3-way — SECONDARY (control-only) switch.
# The box is wired for a ceiling fan, but no fan is installed, so this switch is
# repurposed as the second switch for the study light. The name/device_class
# (study-fan / fan) are historical and kept to avoid churning the HA entity_id
# (fan.study_fan). relay_pin is a GPIO "black hole" so the unused relay never clicks.
# A press goes straight to study-lights over the UDP 3-way link (works with HA
# down); this switch's status LED mirrors the light. Primary: study-lights.yaml.
substitutions:
  name: study-fan
  friendly_name: Study Fan
  ip_address: 10.3.2.100
  udp_peer_ip: 10.3.2.36
  udp_peer_name: study-lights
  device_class: fan
  relay_pin: GPIO4 # Black hole, this is just a control switch.  Don't need the relay "clicking" on.
  mdi_icon: 'mdi:ceiling-fan'

packages:
  switch: !include devices/3way-maxcio-udp-secondary.yaml

esphome:
  area: 'Study'
