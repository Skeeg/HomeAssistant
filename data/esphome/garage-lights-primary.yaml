---
# Garage 3-way PRIMARY — UDP peer-link PILOT (2026-09-27).
# Works with HA down: garage-lights-secondary talks to this node directly over
# UDP (devices/3way-gosund-udp-primary.yaml). HA blueprint instance uses
# primary_toggles_locally: true; extra garage lights (GDO lights, garage lamp)
# still follow via HA only.
# PILOT: DEBUG logging (UART off) to count flash "Saving" events — revert
# global_logging_level/logger_baud_rate once the measurement is done.
substitutions:
  name: garage-lights
  friendly_name: Garage Lights
  ip_address: 10.3.2.135
  hass_event_name: esphome.3way_garage_lights_button
  mdi_icon: 'mdi:spotlight'
  udp_peer_ip: 10.3.2.136
  udp_peer_name: garage-lights-secondary
  global_logging_level: DEBUG
  logger_baud_rate: "0"

packages:
  switch: !include devices/3way-gosund-udp-primary.yaml

esphome:
  area: 'Garage'
