---
substitutions:
  esp8266_board: esp01_1m
  physical_button_pin: GPIO00
  relay_pin: GPIO12
  status_led_pin: GPIO13
  status_led_on_turn_off_action: "light.turn_off" #substitute light.turn_on if you always want the status led to always be on
  status_led_on_turn_on_action: "light.turn_on" #substitute light.turn_off if you always want the status led to always be off
  device_class: light
  button_as_internal: "true"
  button_on_press_action: toggle
  device_restore_mode: "ALWAYS_OFF"
  mdi_icon: "mdi:lightbulb"
  multiclick_delay_on_time: 0.2s
  multiclick_delay_off_time: 0.5s
  multiclick_delay_final_wait_time: 0.5s

packages:
  api: !include ../common/api.yaml
  common-elements: !include ../common/common-elements.yaml
  common-esp8266: !include ../common/common-esp8266.yaml
  esphome: !include ../common/esphome.yaml
  logger: !include ../common/logger.yaml
  ota: !include ../common/ota.yaml
  time: !include ../common/time.yaml
  web: !include ../common/web-server.yaml
  wifi: !include ../common/wifi.yaml

binary_sensor:
  - platform: gpio
    filters:
      # Debounce: physical button must read stable for 50 ms in either
      # direction. Cheap momentary buttons on these switches chatter and
      # register a single press as 4-5 toggles without this.
      - delayed_on_off: 50ms
      - invert:
    id: button_1
    internal: ${button_as_internal}
    name: Button
    pin: ${physical_button_pin}
    on_multi_click:
      - timing:
          - ON for at most ${multiclick_delay_on_time}
          - OFF for at least ${multiclick_delay_final_wait_time}
        then:
          - event.trigger:
              id: button_event
              event_type: single
          - ${device_class}.${button_on_press_action}: ${device_class}_1
      - timing:
          - ON for at most ${multiclick_delay_on_time}
          - OFF for at most ${multiclick_delay_off_time}
          - ON for at most ${multiclick_delay_on_time}
          - OFF for at least ${multiclick_delay_final_wait_time}
        then:
          - event.trigger:
              id: button_event
              event_type: double
      - timing:
          - ON for at most ${multiclick_delay_on_time}
          - OFF for at most ${multiclick_delay_off_time}
          - ON for at most ${multiclick_delay_on_time}
          - OFF for at most ${multiclick_delay_off_time}
          - ON for at most ${multiclick_delay_on_time}
          - OFF for at least ${multiclick_delay_final_wait_time}
        then:
          - event.trigger:
              id: button_event
              event_type: triple
      - timing:
          - ON for at most ${multiclick_delay_on_time}
          - OFF for at most ${multiclick_delay_off_time}
          - ON for at most ${multiclick_delay_on_time}
          - OFF for at most ${multiclick_delay_off_time}
          - ON for at most ${multiclick_delay_on_time}
          - OFF for at most ${multiclick_delay_off_time}
          - ON for at most ${multiclick_delay_on_time}
          - OFF for at least ${multiclick_delay_final_wait_time}
        then:
          - event.trigger:
              id: button_event
              event_type: quad
      - timing:
          - ON for at least 10s
        then:
          - button.press: restart_button


${device_class}:
  - platform: binary
    icon: ${mdi_icon}
    id: ${device_class}_1
    name: None
    on_turn_off:
      - ${status_led_on_turn_off_action}: status_1
    on_turn_on:
      - ${status_led_on_turn_on_action}: status_1
    output: relay_1
    restore_mode: ${device_restore_mode}

# Native HA event entity (event.<name>_button). Replaces the old
# homeassistant.event `esphome.switch {device, action, button}` payloads:
# automations bind to the entity (UI device triggers, logbook history) instead
# of matching on the friendly_name string, and no "perform HA actions"
# permission is needed. Single click still also drives the relay locally.
event:
  - platform: template
    id: button_event
    name: Button
    device_class: button
    event_types:
      - single
      - double
      - triple
      - quad

light:
  - platform: status_led
    disabled_by_default: true
    id: status_1
    internal: true
    name: "Status LED"
    pin:
      inverted: true
      number: ${status_led_pin}

output:
  - platform: gpio
    id: relay_1
    pin: ${relay_pin}
