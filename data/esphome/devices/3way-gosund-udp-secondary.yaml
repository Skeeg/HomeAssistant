---
# 3-way SECONDARY (control-only) — HA-independent peer link over UDP.
#
# Pairs with 3way-gosund-udp-primary.yaml. A press increments press_seq and
# publishes it to the primary via packet_transport; the primary toggles the
# load. The status LED (black-hole relay light) mirrors the primary's
# published relay_state. No homeassistant.event is fired — HA would otherwise
# toggle the primary a second time. Works with HA down.
#
# press_seq starts at a random base each boot (RAM only) so the primary can
# tell "secondary rebooted" (big/backward jump → resync) from "button pressed".
#
# Flash-wear budget: ZERO added writes (no rolling code; RAM-only globals).
# Packets are encrypted with the shared udp_3way_key (RAM-only).
#
# Required substitutions: udp_peer_ip, udp_peer_name (primary's node name).
substitutions:
  esp8266_board: esp01_1m
  physical_button_pin: GPIO00
  led_link_pin: GPIO1
  relay_pin: GPIO4 # Black hole — control-only switch, relay never clicks.
  status_led_pin: GPIO16
  status_led_transition_length: 0ms
  device_class: light
  button_as_internal: "true"
  device_restore_mode: "ALWAYS_OFF"
  mdi_icon: "mdi:lightbulb"
  udp_update_interval: 30s

packages:
  api: !include ../common/api.yaml
  common-elements: !include ../common/common-elements.yaml
  common-esp8266: !include ../common/common-esp8266.yaml
  esphome: !include ../common/esphome.yaml
  logger: !include ../common/logger.yaml
  ota: !include ../common/ota.yaml
  time: !include ../common/time.yaml
  web: !include ../common/web-server.yaml
  wifi: !include ../common/wifi.yaml

globals:
  - id: press_seq_value
    type: float
    restore_value: no # RAM only — no flash writes
    initial_value: "(float) (1000 + (esphome::random_uint32() % 1000000))"

udp:
  addresses:
    - ${udp_peer_ip}

packet_transport:
  platform: udp
  update_interval: ${udp_update_interval}
  # Encrypted (shared key, RAM-only — no flash cost). rolling_code_enable is
  # deliberately OFF: it persists a counter to flash on every boot.
  encryption: !secret udp_3way_key
  providers:
    - name: ${udp_peer_name}
      encryption: !secret udp_3way_key
  sensors:
    - press_seq

binary_sensor:
  - platform: gpio
    filters:
      # Debounce: physical button must read stable for 50 ms in either
      # direction. Cheap momentary buttons on these switches chatter and
      # register a single press as 4-5 toggles without this.
      - delayed_on_off: 50ms
      - invert:
    id: button_1
    internal: ${button_as_internal}
    name: Button
    on_press:
      - lambda: id(press_seq_value) += 1;
      - component.update: press_seq
    pin: ${physical_button_pin}

  # Primary's relay state → drive our status LED / light entity.
  - platform: packet_transport
    id: primary_relay
    provider: ${udp_peer_name}
    remote_id: relay_state
    internal: true
    on_state:
      - if:
          condition:
            lambda: return x;
          then:
            - light.turn_on: light_1
          else:
            - light.turn_off: light_1

sensor:
  - platform: template
    id: press_seq
    internal: true
    accuracy_decimals: 0
    update_interval: 60s
    lambda: return id(press_seq_value);

light:
  - platform: monochromatic
    output: state_led
    id: status_1
    name: Status LED
    default_transition_length: ${status_led_transition_length}
    internal: true
    disabled_by_default: true

  - platform: binary
    icon: ${mdi_icon}
    id: light_1
    name: None
    on_turn_on:
      - light.turn_on: status_1
    on_turn_off:
      - light.turn_off: status_1
    output: relay_1
    restore_mode: ${device_restore_mode}

output:
  - platform: gpio
    id: relay_1
    pin: ${relay_pin}
  - platform: esp8266_pwm
    id: state_led
    pin:
      number: ${led_link_pin}
      inverted: true

status_led:
  pin:
    number: ${status_led_pin}
    inverted: true
