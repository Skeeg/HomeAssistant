---
# 3-way SECONDARY (control-only) — Gosund KS-602S, HA-independent UDP peer link.
#
# A press goes straight to the primary over UDP; the status LED mirrors the
# primary's relay (common/3way-udp/secondary.yaml). Works with HA down.
# Flash wear: ZERO added writes.
#
# Required substitutions: udp_peer_ip, udp_peer_name (primary's node name).
substitutions:
  esp8266_board: esp01_1m
  physical_button_pin: GPIO00
  led_link_pin: GPIO1
  relay_pin: GPIO4 # Black hole — control-only switch, relay never clicks.
  status_led_pin: GPIO16
  status_led_transition_length: 0ms
  device_class: light
  button_as_internal: "true"
  device_restore_mode: "ALWAYS_OFF"
  mdi_icon: "mdi:lightbulb"

packages:
  api: !include ../common/api.yaml
  common-elements: !include ../common/common-elements.yaml
  common-esp8266: !include ../common/common-esp8266.yaml
  esphome: !include ../common/esphome.yaml
  logger: !include ../common/logger.yaml
  ota: !include ../common/ota.yaml
  time: !include ../common/time.yaml
  web: !include ../common/web-server.yaml
  wifi: !include ../common/wifi.yaml
  udp-3way: !include ../common/3way-udp/secondary.yaml

binary_sensor:
  - platform: gpio
    filters:
      # Debounce: physical button must read stable for 50 ms in either
      # direction. Cheap momentary buttons on these switches chatter and
      # register a single press as 4-5 toggles without this.
      - delayed_on_off: 50ms
      - invert:
    id: button_1
    internal: ${button_as_internal}
    name: Button
    on_press:
      - lambda: id(press_seq_value) += 1;
      - component.update: press_seq
      - script.execute: udp_3way_burst
    pin: ${physical_button_pin}

light:
  - platform: monochromatic
    output: state_led
    id: status_1
    name: Status LED
    default_transition_length: ${status_led_transition_length}
    internal: true
    disabled_by_default: true

${device_class}:
  - platform: binary
    icon: ${mdi_icon}
    id: ${device_class}_1
    name: None
    on_turn_on:
      - light.turn_on: status_1
    on_turn_off:
      - light.turn_off: status_1
    output: relay_1
    restore_mode: ${device_restore_mode}

output:
  - platform: gpio
    id: relay_1
    pin: ${relay_pin}
  - platform: esp8266_pwm
    id: state_led
    pin:
      number: ${led_link_pin}
      inverted: true

status_led:
  pin:
    number: ${status_led_pin}
    inverted: true
