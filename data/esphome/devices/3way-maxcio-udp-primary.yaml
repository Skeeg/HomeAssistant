---
# 3-way PRIMARY (load-carrying) — Maxcio, HA-independent UDP peer link.
#
# Same behaviour as 3way-gosund-udp-primary.yaml on Maxcio hardware: always
# toggles locally, fires the HA event for the logbook only (blueprint instance
# sets primary_toggles_locally: true), and accepts secondaries over UDP via one
# common/3way-udp/primary-peer.yaml include per peer.
# Flash wear: ZERO added writes.
substitutions:
  esp8266_board: esp01_1m
  physical_button_pin: GPIO00
  relay_pin: GPIO12
  status_led_pin: GPIO13
  hass_event_name: esphome.${name}_button_pressed
  device_class: light # must stay light (UDP toggle uses the LightState API)
  button_as_internal: "true"
  device_restore_mode: "ALWAYS_OFF"
  mdi_icon: "mdi:lightbulb"

packages:
  api: !include ../common/api.yaml
  common-elements: !include ../common/common-elements.yaml
  common-esp8266: !include ../common/common-esp8266.yaml
  esphome: !include ../common/esphome.yaml
  logger: !include ../common/logger.yaml
  ota: !include ../common/ota.yaml
  time: !include ../common/time.yaml
  web: !include ../common/web-server.yaml
  wifi: !include ../common/wifi.yaml
  udp-3way: !include ../common/3way-udp/primary.yaml

binary_sensor:
  - platform: gpio
    filters:
      # Debounce: physical button must read stable for 50 ms in either
      # direction. Cheap momentary buttons on these switches chatter and
      # register a single press as 4-5 toggles without this.
      - delayed_on_off: 50ms
      - invert:
    id: button_1
    internal: ${button_as_internal}
    name: Button
    on_press:
      - light.toggle: light_1
      - if:
          condition:
            api.connected:
          then:
            - homeassistant.event:
                event: ${hass_event_name}
                data:
                  action: pressed
    pin: ${physical_button_pin}

light:
  - platform: status_led
    disabled_by_default: true
    id: status_1
    internal: true
    name: "Status LED"
    pin:
      inverted: true
      number: ${status_led_pin}

  - platform: binary
    icon: ${mdi_icon}
    id: light_1
    name: None
    on_turn_off:
      - light.turn_off: status_1
    on_turn_on:
      - light.turn_on: status_1
    output: relay_1
    restore_mode: ${device_restore_mode}

output:
  - platform: gpio
    id: relay_1
    pin: ${relay_pin}
